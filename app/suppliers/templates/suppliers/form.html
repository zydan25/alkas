{% extends 'admin/layout.html' %}
{% block content %}<div class='page-header compact'><div><div class='eyebrow'>Suppliers</div><h1>مورد جديد</h1></div></div><section class='panel form-panel'><form method='post' class='form-stack'><input type='hidden' name='csrf_token' value='{{ csrf_token() }}'>{% if error %}<div class='flash danger'>{{ error }}</div>{% endif %}<div class='form-grid'><label>الكود<input name='code' required></label><label>اسم المورد<input name='name_ar' required></label><label>الهاتف<input name='phone'></label><label>العنوان<input name='address_ar'></label></div><button class='btn btn-primary'>حفظ المورد</button></form></section>{% endblock %}
