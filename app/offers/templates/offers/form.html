{% extends "admin/layout.html" %}
{% block content %}
<div class="page-header compact"><div><div class="eyebrow">Offers</div><h1>عرض جديد</h1></div></div>
<section class="panel form-panel">
  <form method="post" enctype="multipart/form-data" class="form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if error %}<div class="flash danger">{{ error }}</div>{% endif %}
    <div class="form-grid">
      <label>العنوان<input name="title_ar" required></label>
      <label>الحالة<select name="status"><option value="draft">مسودة</option><option value="published">منشور</option><option value="active">فعال</option></select></label>
      <label>خصم %<input type="number" name="discount_percent" min="0" max="100" step="0.01"></label>
      <label>خصم ثابت<input type="number" name="fixed_discount" min="0" step="0.01"></label>
      <label>من<input type="datetime-local" name="starts_at"></label>
      <label>إلى<input type="datetime-local" name="ends_at"></label>
      <label>الأولوية<input type="number" name="priority" value="0"></label>
    </div>
    <label class="upload-field upload-field-single">
      <span class="upload-field-icon">🖼</span><span><b>رفع صورة العرض</b><small>JPG · PNG · WEBP · GIF</small></span>
      <input name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
    </label>
    <label>الوصف<textarea name="body_ar" rows="6"></textarea></label>
    <button class="btn btn-primary">حفظ العرض</button>
  </form>
</section>
{% endblock %}
