{% extends 'admin/layout.html' %}
{% block content %}<div class='page-header compact'><div><div class='eyebrow'>Promotions</div><h1>كوبون جديد</h1></div></div><section class='panel form-panel'><form method='post' action='{{ url_for('offers.coupon_create') }}' class='form-stack'><input type='hidden' name='csrf_token' value='{{ csrf_token() }}'><div class='form-grid'><label>رمز الكوبون<input name='code' required style='text-transform:uppercase'></label><label>العرض المرتبط<select name='offer_id'><option value=''>بدون</option>{% for o in offers %}<option value='{{ o.id }}'>{{ o.title_ar }}</option>{% endfor %}</select></label><label>حد الاستخدام<input type='number' name='usage_limit' min='1'></label><label>صالح من<input type='datetime-local' name='valid_from'></label><label>صالح حتى<input type='datetime-local' name='valid_until'></label></div><button class='btn btn-primary'>حفظ الكوبون</button></form></section>{% endblock %}
