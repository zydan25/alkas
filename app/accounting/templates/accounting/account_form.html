{% extends "admin/layout.html" %}{% block content %}<div class="page-header compact"><div><div class="eyebrow">شجرة الحسابات</div><h1>حساب جديد</h1><p>يمكن ترك رمز الحساب للنظام ليولده تلقائيًا.</p></div></div><section class="panel form-panel">{% if error %}<div class="flash danger">{{ error }}</div>{% endif %}<form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>اسم الحساب<input name="name_ar" required></label><div class="form-grid"><label>نوع الحساب<select name="account_type" required><option value="asset">أصول</option><option value="liability">التزامات</option><option value="equity">حقوق ملكية</option><option value="revenue">إيرادات</option><option value="expense">مصروفات</option></select></label><label>الحساب الأب<select name="parent_id"><option value="">حساب رئيسي</option>{% for a in accounts %}<option value="{{ a.id }}">{{ a.code }} · {{ a.name_ar }}</option>{% endfor %}</select></label></div><div class="page-actions"><a class="btn btn-soft" href="{{ url_for('accounting.ui') }}">إلغاء</a><button class="btn btn-primary">إنشاء الحساب</button></div></form></section>{% endblock %}
