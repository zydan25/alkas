{% extends "admin/layout.html" %}{% block content %}<div class="page-header compact"><div><div class="eyebrow">Journal Entry</div><h1>قيد يومية</h1><p>القيد لن يُرحل إلا إذا تساوى إجمالي المدين والدائن وكانت الفترة مفتوحة.</p></div></div><section class="panel form-panel">{% if error %}<div class="flash danger">{{ error }}</div>{% endif %}<form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>التاريخ<input type="date" name="entry_date" value="{{ today }}" required></label><label>المبلغ<input type="number" name="amount" min="0.01" step="0.01" required></label></div><div class="form-grid"><label>من حساب (مدين)<select name="debit_account" required><option value="">اختر</option>{% for a in accounts %}<option value="{{ a.id }}">{{ a.code }} · {{ a.name_ar }}</option>{% endfor %}</select></label><label>إلى حساب (دائن)<select name="credit_account" required><option value="">اختر</option>{% for a in accounts %}<option value="{{ a.id }}">{{ a.code }} · {{ a.name_ar }}</option>{% endfor %}</select></label></div><label>وصف القيد<textarea name="description_ar" rows="3" required></textarea></label><div class="page-actions"><a class="btn btn-soft" href="{{ url_for('accounting.ui') }}">إلغاء</a><button class="btn btn-primary">ترحيل القيد</button></div></form></section>{% endblock %}
