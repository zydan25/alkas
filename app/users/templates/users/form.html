{% extends "admin/layout.html" %}{% block content %}<div class="page-header compact"><div><div class="eyebrow">الحسابات</div><h1>مستخدم جديد</h1><p>أنشئ حساب الدخول ثم اختر الدور الذي يحدد صلاحياته.</p></div></div><section class="panel form-panel">{% if error %}<div class="flash danger">{{ error }}</div>{% endif %}<form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>الاسم الظاهر<input name="display_name" required></label><label>اسم المستخدم<input name="username" required></label><label>الهاتف<input name="phone"></label><label>كلمة المرور<input type="password" name="password" minlength="8" required></label><label>الدور<select name="role_id" required><option value="">اختر الدور</option>{% for r in roles %}<option value="{{ r.id }}">{{ r.name_ar }}</option>{% endfor %}</select></label></div><div class="page-actions"><a class="btn btn-soft" href="{{ url_for('users.ui') }}">إلغاء</a><button class="btn btn-primary">إنشاء المستخدم</button></div></form></section>{% endblock %}
