{% extends "admin/layout.html" %}{% block content %}<div class="page-header compact"><div><div class="eyebrow">RBAC</div><h1>دور جديد</h1><p>اختر الصلاحيات التي سيحصل عليها أي مستخدم مرتبط بهذا الدور.</p></div></div><section class="panel form-panel">{% if error %}<div class="flash danger">{{ error }}</div>{% endif %}<form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>اسم الدور البرمجي<input name="name" placeholder="reception_manager" required></label><label>الاسم العربي<input name="name_ar" placeholder="مدير استقبال" required></label></div><div class="permission-grid">{% for p in permissions %}<label class="permission-option"><input type="checkbox" name="permission_ids" value="{{ p.id }}"><span><b>{{ p.name_ar }}</b><small>{{ p.key }}</small></span></label>{% endfor %}</div><div class="page-actions"><a class="btn btn-soft" href="{{ url_for('users.ui') }}">إلغاء</a><button class="btn btn-primary">حفظ الدور</button></div></form></section>{% endblock %}
