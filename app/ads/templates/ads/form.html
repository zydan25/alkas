{% extends 'admin/layout.html' %}
{% block content %}<div class='page-header compact'><div><div class='eyebrow'>Ads</div><h1>حملة إعلانية جديدة</h1></div></div><section class='panel form-panel'><form method='post' class='form-stack'><input type='hidden' name='csrf_token' value='{{ csrf_token() }}'>{% if error %}<div class='flash danger'>{{ error }}</div>{% endif %}<div class='form-grid'><label>اسم الحملة<input name='name_ar' required></label><label>المعلن<input name='advertiser_ar'></label><label>الميزانية<input type='number' name='budget' min='0' step='0.01'></label><label>الحالة<select name='status'><option value='draft'>مسودة</option><option value='active'>فعالة</option><option value='paused'>متوقفة</option></select></label><label>من<input type='datetime-local' name='starts_at'></label><label>إلى<input type='datetime-local' name='ends_at'></label></div><button class='btn btn-primary'>حفظ الحملة</button></form></section>{% endblock %}
