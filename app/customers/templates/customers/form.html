{% extends "admin/layout.html" %}{% block content %}<div class="page-header compact"><div><div class="eyebrow">CRM</div><h1>عميل جديد</h1><p>أنشئ ملف العميل ثم اربطه بالحساب أو الحجوزات لاحقًا.</p></div></div><section class="panel form-panel">{% if error %}<div class="flash danger">{{ error }}</div>{% endif %}<form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>اسم العميل<input name="name" value="{{ row.name if row and row.name is defined else '' }}" required></label><label>الهاتف<input name="phone" value="{{ row.phone if row and row.phone is defined else '' }}"></label><label>الكود<input name="customer_code" value="{{ row.customer_code if row and row.customer_code is defined else '' }}" placeholder="يُنشأ تلقائيًا"></label><label>البريد<input type="email" name="email" value="{{ row.email if row and row.email is defined else '' }}"></label></div><label>ملاحظات<textarea name="notes" rows="4">{{ row.notes if row and row.notes is defined else '' }}</textarea></label><div class="page-actions"><a class="btn btn-soft" href="{{ url_for('admin.customers') }}">إلغاء</a><button class="btn btn-primary">حفظ العميل</button></div></form></section>{% endblock %}
