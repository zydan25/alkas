{% extends 'admin/layout.html' %}
{% block content %}<div class='page-header compact'><div><div class='eyebrow'>Players</div><h1>لاعب جديد</h1></div></div><section class='panel form-panel'><form method='post' class='form-stack'><input type='hidden' name='csrf_token' value='{{ csrf_token() }}'>{% if error %}<div class='flash danger'>{{ error }}</div>{% endif %}<div class='form-grid'><label>الكود<input name='player_code' placeholder='PLY-00001'></label><label>الاسم<input name='name_ar' required></label><label>الهاتف<input name='phone'></label><label>تاريخ الميلاد<input type='date' name='birth_date'></label><label>رابط الصورة<input name='photo_url'></label></div><button class='btn btn-primary'>حفظ اللاعب</button></form></section>{% endblock %}
