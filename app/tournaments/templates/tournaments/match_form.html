{% extends 'admin/layout.html' %}
{% block content %}<div class='page-header compact'><div><div class='eyebrow'>Matches</div><h1>مباراة جديدة</h1><p>اربط المباراة بالبطولة والفريقين والملعب وموعدها.</p></div></div>
<section class='panel form-panel'><form method='post' action='{{ url_for('tournaments.match_create') }}' class='form-stack'><input type='hidden' name='csrf_token' value='{{ csrf_token() }}'><div class='form-grid'><label>البطولة<select name='tournament_id' required>{% for t in tournaments %}<option value='{{ t.id }}'>{{ t.name_ar }}</option>{% endfor %}</select></label><label>الفريق الأول<select name='team_a_id'>{% for t in teams %}<option value='{{ t.id }}'>{{ t.name_ar }}</option>{% endfor %}</select></label><label>الفريق الثاني<select name='team_b_id'>{% for t in teams %}<option value='{{ t.id }}'>{{ t.name_ar }}</option>{% endfor %}</select></label><label>الملعب<select name='resource_id'><option value=''>بدون</option>{% for r in resources %}<option value='{{ r.id }}'>{{ r.name_ar }}</option>{% endfor %}</select></label><label>موعد المباراة<input type='datetime-local' name='starts_at'></label></div><button class='btn btn-primary'>حفظ المباراة</button></form></section>{% endblock %}
