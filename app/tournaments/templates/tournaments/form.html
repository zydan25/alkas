{% extends 'admin/layout.html' %}
{% block content %}<div class='page-header compact'><div><div class='eyebrow'>Tournaments</div><h1>بطولة جديدة</h1></div></div>
<section class='panel form-panel'><form method='post' class='form-stack'><input type='hidden' name='csrf_token' value='{{ csrf_token() }}'>{% if error %}<div class='flash danger'>{{ error }}</div>{% endif %}<div class='form-grid'><label>اسم البطولة<input name='name_ar' required></label><label>الرياضة<select name='sport_id' required>{% for s in sports %}<option value='{{ s.id }}'>{{ s.name_ar }}</option>{% endfor %}</select></label><label>تبدأ<input type='date' name='starts_on' required></label><label>تنتهي<input type='date' name='ends_on'></label><label>رسوم الدخول<input type='number' name='entry_fee' min='0' step='0.01' value='0'></label><label>الحالة<select name='status'><option value='draft'>مسودة</option><option value='published'>منشورة</option><option value='live'>مباشرة</option></select></label></div><label class='check-option'><input type='checkbox' name='registration_open' value='1' checked><span>التسجيل مفتوح</span></label><label>الجوائز<textarea name='prize_description_ar' rows='3'></textarea></label><label>القواعد<textarea name='rules_ar' rows='6'></textarea></label><button class='btn btn-primary'>حفظ البطولة</button></form></section>{% endblock %}
