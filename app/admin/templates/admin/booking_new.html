{% extends "admin/layout.html" %}
{% block content %}
<div class="page-header compact">
  <div><div class="eyebrow">الاستقبال</div><h1>إنشاء حجز للعميل</h1><p>يؤكد الحجز وينشئ الفاتورة والقيد المحاسبي مباشرة.</p></div>
  <a class="btn btn-soft" href="{{ url_for('admin.bookings') }}">← التقويم</a>
</div>
<section class="panel form-panel">
{% if error %}<div class="flash danger">{{ error }}</div>{% endif %}
<form class="form-stack" method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>العميل<select name="customer_id" required><option value="">اختر العميل</option>{% for c in customers %}<option value="{{ c.id }}">{{ c.name }} · {{ c.phone or c.customer_code }}</option>{% endfor %}</select></label>
<div class="form-grid"><label>وقت البداية<input type="datetime-local" name="start_at" required></label><label>المدة<select name="duration"><option value="60">ساعة</option><option value="90">90 دقيقة</option><option value="120">ساعتان</option><option value="180">3 ساعات</option></select></label></div>
<div><div class="eyebrow" style="margin-bottom:8px">الملعب أو عدة ملاعب</div><div class="resource-grid">{% for r in resources %}<label class="resource-option"><input type="checkbox" name="resource_ids" value="{{ r.id }}"><span><strong>{{ r.name_ar }}</strong><small>{{ r.sport.name_ar }} · {{ r.base_price }}/ساعة</small></span></label>{% endfor %}</div></div>
<div class="page-actions"><a class="btn btn-soft" href="{{ url_for('admin.bookings') }}">إلغاء</a><button class="btn btn-primary">تأكيد وإنشاء الفاتورة</button></div>
</form>
</section>
{% endblock %}
