{% extends "admin/layout.html" %}{% block content %}<div class="page-header compact"><div><div class="eyebrow">المال</div><h1>فاتورة يدوية</h1><p>الفاتورة ستنشئ قيد ذمة وإيراد تلقائيًا.</p></div></div><section class="panel form-panel">{% if error %}<div class="flash danger">{{ error }}</div>{% endif %}<form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>العميل<select name="customer_id" required><option value="">اختر العميل</option>{% for c in customers %}<option value="{{ c.id }}">{{ c.name }} · {{ c.phone or c.customer_code }}</option>{% endfor %}</select></label><label>الوصف<input name="description_ar" required></label><label>المبلغ<input name="amount" type="number" step="0.01" min="0.01" required></label><div class="page-actions"><a class="btn btn-soft" href="{{ url_for('invoices.ui') }}">إلغاء</a><button class="btn btn-primary">إصدار وترحيل</button></div></form></section>{% endblock %}
