{% extends "admin/layout.html" %}
{% block content %}
<div class="page-header compact">
  <div><div class="eyebrow">تطبيق مستقل · {{ module_key }}</div><h1>{{ title }}</h1><p>{{ description }}</p></div>
  <a class="btn btn-soft" href="{{ api }}">مصدر البيانات ↗</a>
</div>
<section class="module-hero-card">
  <div><span>السجلات</span><strong>{{ count }}</strong><small>البيانات محفوظة داخل تطبيق {{ module_key }} المستقل</small></div>
  <div class="module-flow"><span>واجهة</span><b>→</b><span>Service</span><b>→</b><span>Database</span></div>
</section>
<section class="panel">
  <div class="panel-head"><div><span class="eyebrow">عرض حي</span><h2>بيانات التطبيق</h2></div><span class="mini-badge" data-module-state>جارٍ التحميل</span></div>
  <div class="dynamic-module" data-module-api="{{ api }}">
    <div class="loading-state"><i></i><i></i><i></i></div>
  </div>
</section>
{% endblock %}
