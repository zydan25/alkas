{% extends 'admin/layout.html' %}
{% block content %}<div class='page-header compact'><div><div class='eyebrow'>Streams</div><h1>مصدر بث جديد</h1></div></div>
<section class='panel form-panel'><form method='post' action='{{ url_for('live.stream_create') }}' class='form-stack'><input type='hidden' name='csrf_token' value='{{ csrf_token() }}'><div class='form-grid'><label>الفعالية<select name='event_id' required>{% for e in events %}<option value='{{ e.id }}'>{{ e.name_ar }}</option>{% endfor %}</select></label><label>المزود<input name='provider' value='custom'></label><label>رابط المصدر<input name='stream_url' type='url' required></label><label>رابط المشاهدة<input name='playback_url' type='url'></label><label>الحالة<select name='status'><option value='scheduled'>مجدول</option><option value='live'>مباشر</option><option value='ended'>منتهي</option></select></label></div><button class='btn btn-primary'>حفظ مصدر البث</button></form></section>{% endblock %}
