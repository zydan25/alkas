{% extends 'admin/layout.html' %}
{% block content %}<div class='page-header compact'><div><div class='eyebrow'>Live</div><h1>فعالية بث جديدة</h1></div></div><section class='panel form-panel'><form method='post' class='form-stack'><input type='hidden' name='csrf_token' value='{{ csrf_token() }}'>{% if error %}<div class='flash danger'>{{ error }}</div>{% endif %}<div class='form-grid'><label>اسم الفعالية<input name='name_ar' required></label><label>النوع<select name='event_type'><option value='match'>مباراة</option><option value='event'>فعالية</option><option value='training'>تدريب</option></select></label><label>البداية<input type='datetime-local' name='starts_at'></label><label>الحالة<select name='status'><option value='scheduled'>مجدولة</option><option value='live'>مباشرة</option><option value='ended'>منتهية</option></select></label><label>الغلاف<input name='cover_url'></label></div><label>الوصف<textarea name='description_ar' rows='5'></textarea></label><button class='btn btn-primary'>حفظ الفعالية</button></form></section>{% endblock %}
