{% extends "admin/layout.html" %}{% block content %}<div class="page-header compact"><div><div class="eyebrow">التسعير</div><h1>قاعدة سعر جديدة</h1><p>حدد اليوم والساعة والمدة والأولوية، وسيستخدمها محرك التسعير تلقائيًا.</p></div></div><section class="panel form-panel">{% if error %}<div class="flash danger">{{ error }}</div>{% endif %}<form class="form-stack" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>اسم القاعدة<input name="name_ar" required></label><label>السعر لكل ساعة<input type="number" name="price_per_hour" min="0" step="0.01" required></label><label>اليوم<select name="weekday"><option value="">كل الأيام</option><option value="0">الاثنين</option><option value="1">الثلاثاء</option><option value="2">الأربعاء</option><option value="3">الخميس</option><option value="4">الجمعة</option><option value="5">السبت</option><option value="6">الأحد</option></select></label><label>من الساعة<input type="time" name="start_time"></label><label>إلى الساعة<input type="time" name="end_time"></label><label>أقل مدة دقائق<input type="number" name="min_minutes" min="1"></label><label>أقصى مدة دقائق<input type="number" name="max_minutes" min="1"></label><label>الأولوية<input type="number" name="priority" value="0"></label></div><div class="page-actions"><a class="btn btn-soft" href="{{ url_for('pricing.ui') }}">إلغاء</a><button class="btn btn-primary">حفظ قاعدة السعر</button></div></form></section>{% endblock %}
