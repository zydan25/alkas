{% extends 'admin/layout.html' %}
{% block content %}<div class='page-header compact'><div><div class='eyebrow'>News</div><h1>خبر جديد</h1></div></div><section class='panel form-panel'><form method='post' class='form-stack'><input type='hidden' name='csrf_token' value='{{ csrf_token() }}'>{% if error %}<div class='flash danger'>{{ error }}</div>{% endif %}<div class='form-grid'><label>العنوان<input name='title_ar' required></label><label>التصنيف<select name='category_id'><option value=''>بدون</option>{% for c in categories %}<option value='{{ c.id }}'>{{ c.name_ar }}</option>{% endfor %}</select></label><label>الحالة<select name='status'><option value='draft'>مسودة</option><option value='published'>منشور</option></select></label><label>رابط الغلاف<input name='cover_url'></label></div><label>الملخص<textarea name='summary_ar' rows='3'></textarea></label><label>المحتوى<textarea name='body_ar' rows='10'></textarea></label><button class='btn btn-primary'>حفظ الخبر</button></form></section>{% endblock %}
