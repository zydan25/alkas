{% extends 'admin/layout.html' %}
{% block content %}<div class='page-header compact'><div><div class='eyebrow'>Inventory</div><h1>حركة مخزون جديدة</h1></div></div><section class='panel form-panel'><form method='post' class='form-stack'><input type='hidden' name='csrf_token' value='{{ csrf_token() }}'><div class='form-grid'><label>المنتج<select name='product_id' required>{% for p in products %}<option value='{{ p.id }}'>{{ p.sku }} · {{ p.name_ar }}</option>{% endfor %}</select></label><label>المستودع<select name='warehouse_id' required>{% for w in warehouses %}<option value='{{ w.id }}'>{{ w.code }} · {{ w.name_ar }}</option>{% endfor %}</select></label><label>النوع<select name='movement_type'><option value='in'>دخول</option><option value='out'>خروج</option><option value='adjustment'>تسوية</option></select></label><label>الكمية<input type='number' name='quantity' min='0.01' step='0.01' required></label><label>تكلفة الوحدة<input type='number' name='unit_cost' min='0' step='0.01' value='0'></label></div><button class='btn btn-primary'>حفظ الحركة</button></form></section>{% endblock %}
