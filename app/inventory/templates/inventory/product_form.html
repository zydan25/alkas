{% extends 'admin/layout.html' %}
{% block content %}<div class='page-header compact'><div><div class='eyebrow'>Inventory</div><h1>منتج جديد</h1></div></div><section class='panel form-panel'><form method='post' class='form-stack'><input type='hidden' name='csrf_token' value='{{ csrf_token() }}'>{% if error %}<div class='flash danger'>{{ error }}</div>{% endif %}<div class='form-grid'><label>SKU<input name='sku' required></label><label>اسم المنتج<input name='name_ar' required></label><label>التصنيف<select name='category_id'><option value=''>بدون</option>{% for c in categories %}<option value='{{ c.id }}'>{{ c.name_ar }}</option>{% endfor %}</select></label><label>الوحدة<input name='unit_ar' value='قطعة'></label><label>سعر التكلفة<input type='number' name='cost_price' min='0' step='0.01'></label><label>سعر البيع<input type='number' name='sale_price' min='0' step='0.01'></label><label>حد إعادة الطلب<input type='number' name='reorder_level' min='0' step='0.01'></label></div><button class='btn btn-primary'>حفظ المنتج</button></form></section>{% endblock %}
