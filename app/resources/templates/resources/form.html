{% extends "admin/layout.html" %}{% block content %}<div class="page-header compact"><div><div class="eyebrow">الموارد</div><h1>إضافة ملعب / مورد</h1><p>المورد هو الوحدة القابلة للحجز التي تدخل في الأسعار والحجوزات والصيانة.</p></div></div><section class="panel form-panel">{% if error %}<div class="flash danger">{{ error }}</div>{% endif %}<form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>المفتاح<input name="key" placeholder="football-4" required></label><label>الاسم<input name="name_ar" required></label><label>الرياضة<select name="sport_id" required>{% for s in sports %}<option value="{{ s.id }}">{{ s.name_ar }}</option>{% endfor %}</select></label><label>المنطقة<select name="zone_id" required>{% for z in zones %}<option value="{{ z.id }}">{{ z.name_ar }}</option>{% endfor %}</select></label><label>السعر الأساسي/ساعة<input type="number" min="0" step="0.01" name="base_price" required></label><label>السعة<input type="number" min="1" name="capacity"></label></div><div class="page-actions"><a class="btn btn-soft" href="{{ url_for('admin.resources') }}">إلغاء</a><button class="btn btn-primary">حفظ المورد</button></div></form></section>{% endblock %}
