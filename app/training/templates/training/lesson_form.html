{% extends 'admin/layout.html' %}
{% block content %}<div class='page-header compact'><div><div class='eyebrow'>Training</div><h1>حصة تدريبية جديدة</h1></div></div>
<section class='panel form-panel'><form method='post' class='form-stack'><input type='hidden' name='csrf_token' value='{{ csrf_token() }}'>{% if error %}<div class='flash danger'>{{ error }}</div>{% endif %}<div class='form-grid'><label>البرنامج<select name='program_id' required>{% for p in programs %}<option value='{{ p.id }}'>{{ p.name_ar }}</option>{% endfor %}</select></label><label>العميل<select name='customer_id' required>{% for c in customers %}<option value='{{ c.id }}'>{{ c.name }}</option>{% endfor %}</select></label><label>الملعب/المورد<select name='resource_id'><option value=''>بدون</option>{% for r in resources %}<option value='{{ r.id }}'>{{ r.name_ar }}</option>{% endfor %}</select></label><label>البداية<input type='datetime-local' name='starts_at' required></label><label>النهاية<input type='datetime-local' name='ends_at' required></label></div><button class='btn btn-primary'>جدولة الحصة</button></form></section>{% endblock %}
