{% extends 'admin/layout.html' %}
{% block content %}<div class='page-header compact'><div><div class='eyebrow'>Training</div><h1>برنامج تدريبي جديد</h1></div></div>
<section class='panel form-panel'><form method='post' class='form-stack'><input type='hidden' name='csrf_token' value='{{ csrf_token() }}'>{% if error %}<div class='flash danger'>{{ error }}</div>{% endif %}<div class='form-grid'><label>الرياضة<select name='sport_id' required>{% for s in sports %}<option value='{{ s.id }}'>{{ s.name_ar }}</option>{% endfor %}</select></label><label>المدرب<select name='coach_id'><option value=''>بدون</option>{% for c in coaches %}<option value='{{ c.id }}'>{{ c.name_ar }}</option>{% endfor %}</select></label><label>الاسم<input name='name_ar' required></label><label>السعة<input type='number' name='capacity' min='1'></label><label>السعر<input type='number' name='price' min='0' step='0.01' value='0'></label></div><label>الوصف<textarea name='description_ar' rows='4'></textarea></label><button class='btn btn-primary'>حفظ البرنامج</button></form></section>{% endblock %}
